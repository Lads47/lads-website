name: Vérification du site Astro
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    name: Construction et contrôles statiques
    # Use a stable runner image and its installed Chrome, as in the local checks.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      suites: ${{ steps.plan.outputs.suites }}
      attempt: ${{ steps.plan.outputs.attempt }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
      - run: npm ci
      - name: Vérifier la répartition et la barrière de publication
        run: node --test tests/ci/*.test.mjs
      - name: Vérifier le déploiement et ses chemins de retour arrière
        run: python3 -m unittest discover -s tests/deploy -v
      - run: npm run check
      - run: npm run build
      - run: npm test
      - name: Définir les lots de contrôles
        id: plan
        shell: bash
        run: |
          node --input-type=module -e "import { browserSuites } from './scripts/browser-suites.mjs'; console.log('suites=' + JSON.stringify(Object.keys(browserSuites)))" >> "$GITHUB_OUTPUT"
          echo "attempt=$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - name: Préparer le même build pour les tests et la publication
        run: node scripts/package-release.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: site-${{ github.sha }}-${{ github.run_attempt }}
          path: dist/
          retention-days: 7
          if-no-files-found: error
  browser:
    name: Navigateur (${{ matrix.suite }})
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        suite: ${{ fromJSON(needs.build.outputs.suites) }}
    steps:
      - name: Exiger le build de cette tentative
        env:
          BUILD_ATTEMPT: ${{ needs.build.outputs.attempt }}
        run: test "$BUILD_ATTEMPT" = "$GITHUB_RUN_ATTEMPT" || { echo 'Relancer tous les jobs pour reconstruire un artefact cohérent.'; exit 1; }
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: site-${{ github.sha }}-${{ github.run_attempt }}
          path: dist/
      - name: Sélectionner Chrome stable du runner
        shell: bash
        run: |
          lads_browser_path="$(command -v google-chrome)"
          "$lads_browser_path" --version
          echo "BROWSER_PATH=$lads_browser_path" >> "$GITHUB_ENV"
      - name: Vérifier le rendu et les interactions
        env:
          BROWSER_SUITE: ${{ matrix.suite }}
        shell: bash
        run: |
          npm run preview > /tmp/lads-preview.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4321/ > /dev/null; then break; fi
            sleep 1
          done
          npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-navigateur-${{ matrix.suite }}-${{ github.run_attempt }}
          path: test-results/
          retention-days: 14
          if-no-files-found: error
  quality:
    needs: [build, browser]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Exiger tous les contrôles de cette tentative
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
          BUILD_ATTEMPT: ${{ needs.build.outputs.attempt }}
        run: |
          test "$BUILD_RESULT" = success
          test "$BROWSER_RESULT" = success
          test "$BUILD_ATTEMPT" = "$GITHUB_RUN_ATTEMPT" || { echo 'Relancer tous les jobs pour reconstruire un artefact cohérent.'; exit 1; }
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - uses: actions/download-artifact@v4
        with:
          pattern: verification-navigateur-*-${{ github.run_attempt }}
          path: test-results/
          merge-multiple: true
      - name: Vérifier les six rapports et les 70 captures
        run: node scripts/verify-browser-reports.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: verification-navigateur-${{ github.run_attempt }}
          path: test-results/browser-report.json
          retention-days: 14
          if-no-files-found: error
  deploy:
    name: Publication Hostinger
    needs: [build, quality]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.HOSTINGER_AUTO_DEPLOY != 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    concurrency:
      group: hostinger-production
      cancel-in-progress: false
    steps:
      - name: Exiger le build de cette tentative
        env:
          BUILD_ATTEMPT: ${{ needs.build.outputs.attempt }}
        run: test "$BUILD_ATTEMPT" = "$GITHUB_RUN_ATTEMPT" || { echo 'Relancer tous les jobs pour reconstruire un artefact cohérent.'; exit 1; }
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Réserver la publication aux fusions sur le main actuel
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          head=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          merged=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq '[.[] | select(.merged_at != null and .base.ref == "main")] | length')
          if [[ $head == "$GITHUB_SHA" && $merged -gt 0 ]]; then
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          else
            echo 'Publication ignorée : commit dépassé ou push direct sans PR fusionnée.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/download-artifact@v4
        if: steps.gate.outputs.publish == 'true'
        with:
          name: site-${{ github.sha }}-${{ github.run_attempt }}
          path: dist/
      - name: Publier, contrôler et restaurer en cas d'échec
        if: steps.gate.outputs.publish == 'true'
        env:
          HOSTINGER_SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
        run: bash scripts/deploy.sh
      - name: Résumer la publication
        if: success() && steps.gate.outputs.publish == 'true'
        env:
          REVISION: ${{ github.sha }}
        run: |
          printf 'Version vérifiée et publiée sur https://lesateliersdustream.fr/ : `%s`\n' "$REVISION" >> "$GITHUB_STEP_SUMMARY"
