name: Vérification du site Astro
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  quality:
    # Use a stable runner image and its installed Chrome, as in the local checks.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm test
      - name: Sélectionner Chrome stable du runner
        shell: bash
        run: |
          lads_browser_path="$(command -v google-chrome)"
          "$lads_browser_path" --version
          echo "BROWSER_PATH=$lads_browser_path" >> "$GITHUB_ENV"
      - name: Vérifier le rendu et les interactions
        shell: bash
        run: |
          npm run preview > /tmp/lads-preview.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4321/ > /dev/null; then break; fi
            sleep 1
          done
          npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-navigateur
          path: test-results/
          retention-days: 14
