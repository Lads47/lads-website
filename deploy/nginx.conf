map $request_uri $html_redirect {
    ~*^(/google.+\.html)$   "";
    ~*^(.+)\.html$          $1;
}

server {
    listen 80;
    server_name lesateliersdustream.fr www.lesateliersdustream.fr;
    root /usr/share/nginx/html/current;
    index index.html;

    # Pages HTML : revalidation systematique. Sans Cache-Control, les navigateurs
    # appliquent une heuristique (~10 % de l'age du document) et peuvent garder
    # une page plusieurs heures apres une publication. Les blocs css/js et
    # images ci-dessous definissent leur propre politique et ne sont pas affectes.
    expires -1;

    # 301 redirects: old nos-/notre- URLs to new clean URLs
    location = /nos-solutions { return 301 https://$host/solutions; }
    location = /nos-realisations { return 301 https://$host/realisations; }
    location = /nos-formations { return 301 https://$host/formations; }
    location = /notre-approche { return 301 https://$host/approche; }
    location = /notre-histoire { return 301 https://$host/histoire; }

    # Explicit mapping for pages that share name with directories
    location = /solutions { rewrite ^ /solutions.html last; }
    location = /realisations { rewrite ^ /realisations.html last; }
    location = /formations { rewrite ^ /formations.html last; }

    # Redirect .html URLs to clean URLs (google verification files excluded via map)
    if ($html_redirect) {
        return 301 https://$host$html_redirect;
    }

    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    error_page 404 /404.html;

    # Fichiers caches (.git, .env...) : jamais servis.
    location ~ /\. {
        return 404;
    }

    # Ressources Astro : nom de fichier change a chaque version, cache d'un an.
    location ^~ /_astro/ {
        alias /usr/share/nginx/html/.assets/;
        expires off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Sous-titres WebVTT : type absent de mime.types (types vide = ne pas
    # ecraser la table globale, seulement le type par defaut de ce bloc).
    location ~* \.vtt$ {
        types { }
        default_type "text/vtt; charset=utf-8";
        expires 1d;
    }

    # JS/CSS : cache court, le navigateur revalide a chaque visite
    location ~* \.(css|js)$ {
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
    }

    # Images/fonts/videos : cache long (changent rarement)
    location ~* \.(jpg|jpeg|png|gif|ico|svg|woff2|woff|ttf|webp|avif|mp4)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript image/svg+xml application/json application/xml text/xml text/vtt;
    gzip_min_length 256;
}
